<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Vaults — One Night, Three Vaults</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 0; top: 0; color: #0f0; font: 12px monospace; background: #000; z-index: 9; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Sunset Vaults: sneak through Bank Senja, steal the named treasures and escape unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="selftest"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
